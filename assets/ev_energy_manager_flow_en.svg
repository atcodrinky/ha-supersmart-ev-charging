<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SuperSmart EV Charging — operating flow</title>
  <desc id="desc">Updated smart EV charging diagram: inputs, safeguards, Force, PV and off-peak priorities, dynamic balancing and wallbox commands.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121A35"/><stop offset="1" stop-color="#243A69"/></linearGradient>
    <linearGradient id="controller" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8F2FF"/><stop offset="1" stop-color="#F5F9FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17213A" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#52627A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#16835C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.title{font-size:34px;font-weight:700;fill:#fff}.subtitle{font-size:17px;font-weight:400;fill:#DCE8FF}.section{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#52627A}.head{font-size:18px;font-weight:700;fill:#17213A}.body{font-size:14px;font-weight:500;fill:#33415C}.small{font-size:12px;font-weight:500;fill:#607089}.arrow{fill:none;stroke:#52627A;stroke-width:2;marker-end:url(#arrow)}.arrow-green{fill:none;stroke:#16835C;stroke-width:2.4;marker-end:url(#arrowGreen)}.dashed{stroke-dasharray:6 6}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#F5F7FB"/><rect width="1600" height="104" fill="url(#header)"/>
  <circle cx="61" cy="52" r="29" fill="#2F72FF"/><path d="M39 57h43l8 9h12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="51" cy="69" r="6" fill="#fff"/><circle cx="78" cy="69" r="6" fill="#fff"/><path d="M66 27v17h-9l13 17V44h9z" fill="#FFD21C"/>
  <text class="title" x="112" y="47">SuperSmart EV Charging</text>
  <text class="subtitle" x="112" y="76">Chooses how to charge using solar, off-peak tariff and available power — safely.</text>
  <rect x="1340" y="28" width="202" height="48" rx="24" fill="#FFFFFF" fill-opacity=".12" stroke="#FFFFFF" stroke-opacity=".25"/><text x="1441" y="52" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#fff">HOME ASSISTANT + MQTT</text>

  <text class="section" x="50" y="132">1 · WHAT IT WATCHES</text>
  <g filter="url(#shadow)">
    <rect x="50" y="146" width="225" height="86" rx="16" fill="#fff"/><circle cx="84" cy="181" r="20" fill="#E8F2FF"/><text x="84" y="182" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="800" fill="#2563C9">EV</text><text class="head" x="116" y="177">Vehicle</text><text class="small" x="116" y="200">SOC · connection · targets</text>
    <rect x="305" y="146" width="225" height="86" rx="16" fill="#fff"/><circle cx="339" cy="181" r="20" fill="#EAF8F1"/><text x="339" y="182" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="800" fill="#16835C">PV</text><text class="head" x="371" y="177">Energy</text><text class="small" x="371" y="200">grid ± W · PV production</text>
    <rect x="560" y="146" width="225" height="86" rx="16" fill="#fff"/><circle cx="594" cy="181" r="20" fill="#FFF4DC"/><text x="594" y="182" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="800" fill="#B66A00">WB</text><text class="head" x="626" y="177">Wallbox</text><text class="small" x="626" y="200">state · power · voltage</text>
    <rect x="815" y="146" width="225" height="86" rx="16" fill="#fff"/><circle cx="849" cy="181" r="20" fill="#F0EAFF"/><text x="849" y="182" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="800" fill="#6941C6">F3</text><text class="head" x="881" y="177">Context</text><text class="small" x="881" y="200">tariff · sun above/below</text>
    <rect x="1070" y="146" width="225" height="86" rx="16" fill="#fff"/><circle cx="1104" cy="181" r="20" fill="#FFE8E8"/><text x="1104" y="182" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="800" fill="#B42318">!</text><text class="head" x="1136" y="177">User controls</text><text class="small" x="1136" y="200">Master Stop · Force · off-peak</text>
    <rect x="1325" y="146" width="225" height="86" rx="16" fill="#fff"/><circle cx="1359" cy="181" r="20" fill="#E9EEF6"/><text x="1359" y="182" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="800" fill="#52627A">W</text><text class="head" x="1391" y="177">Thresholds</text><text class="small" x="1391" y="200">total · off-peak · PV offset</text>
  </g>

  <text class="section" x="50" y="274">2 · HOW IT DECIDES</text>
  <g filter="url(#shadow)">
    <rect x="50" y="292" width="190" height="88" rx="18" fill="#EAF8F1" stroke="#8DD4B6"/><circle cx="83" cy="326" r="18" fill="#16835C"/><path d="M75 326l6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="head" x="111" y="323">EV connected</text><text class="small" x="111" y="347">wallbox ready</text>
    <rect x="286" y="292" width="200" height="88" rx="18" fill="#fff" stroke="#C7D1E0"/><text class="head" x="386" y="322" text-anchor="middle">Valid data?</text><text class="small" x="386" y="348" text-anchor="middle">SOC and power available</text>
    <rect x="532" y="292" width="236" height="88" rx="18" fill="#FFF7E8" stroke="#F3C979"/><text class="head" x="650" y="318" text-anchor="middle">Safety gate</text><text class="small" x="650" y="341" text-anchor="middle">Master Stop · SOC reached</text><text class="small" x="650" y="360" text-anchor="middle">unplugged → reset</text>
    <rect x="814" y="292" width="246" height="88" rx="18" fill="#E8F2FF" stroke="#90B9F4"/><text class="head" x="937" y="316" text-anchor="middle">Priority selector</text><text class="small" x="937" y="340" text-anchor="middle">1 Force · 2 PV · 3 off-peak</text><text class="small" x="937" y="359" text-anchor="middle">otherwise wait</text>
    <rect x="1106" y="292" width="204" height="88" rx="18" fill="#F0F2F6" stroke="#C7D1E0"/><text class="head" x="1208" y="322" text-anchor="middle">IDLE</text><text class="small" x="1208" y="348" text-anchor="middle">waits for useful conditions</text>
    <rect x="1356" y="292" width="194" height="88" rx="18" fill="#FFE8E8" stroke="#EEA3A3"/><text class="head" x="1453" y="320" text-anchor="middle" fill="#9F1C16">SAFE STOP</text><text class="small" x="1453" y="344" text-anchor="middle">pause + revoke</text><text class="small" x="1453" y="362" text-anchor="middle">authorization</text>
  </g>
  <path class="arrow-green" d="M240 336H286"/><path class="arrow" d="M486 336H532"/><path class="arrow" d="M768 336H814"/><path class="arrow" d="M1060 336H1106"/><path class="arrow" d="M650 292V270H1453V292"/>
  <text class="small" x="348" y="399" text-anchor="middle">NO → no new command</text><path class="arrow dashed" d="M386 380V415H244"/>

  <text class="section" x="50" y="454">3 · SELECTED MODE</text>
  <g filter="url(#shadow)">
    <rect x="120" y="476" width="380" height="152" rx="22" fill="#FFF3DB" stroke="#F0BA55"/><circle cx="163" cy="518" r="25" fill="#F59E0B"/><path d="M166 494l-19 28h16l-6 24 24-34h-17z" fill="#fff"/><text class="head" x="201" y="508">FORCE CHARGE</text><text class="body" x="201" y="533">Vehicle SOC target · Normal mode</text><line x1="151" y1="559" x2="469" y2="559" stroke="#E9BE71"/><text class="small" x="151" y="584">Uses the total operating power limit</text><text class="small" x="151" y="606">while protecting household loads.</text>
    <rect x="610" y="476" width="380" height="152" rx="22" fill="#EAF8F1" stroke="#78CDA8"/><circle cx="653" cy="518" r="25" fill="#16A36D"/><circle cx="653" cy="518" r="9" fill="#fff"/><g stroke="#fff" stroke-width="2.5"><path d="M653 499v-7M653 544v-7M634 518h-7M679 518h-7M640 505l-5-5M671 536l-5-5M666 505l5-5M635 536l5-5"/></g><text class="head" x="691" y="508">PV SURPLUS</text><text class="body" x="691" y="533">Vehicle SOC target · Solar mode</text><line x1="641" y1="559" x2="959" y2="559" stroke="#8AD0B1"/><text class="small" x="641" y="584">Tracks export/import and PV offset;</text><text class="small" x="641" y="606">start and stop use anti-bounce hysteresis.</text>
    <rect x="1100" y="476" width="380" height="152" rx="22" fill="#F1ECFF" stroke="#BCA6F2"/><circle cx="1143" cy="518" r="25" fill="#7457D5"/><path d="M1149 497a21 21 0 1 0 14 34 24 24 0 0 1-14-34z" fill="#fff"/><text class="head" x="1181" y="508">NIGHT / OFF-PEAK</text><text class="body" x="1181" y="533">User SOC target · Normal mode</text><line x1="1131" y1="559" x2="1449" y2="559" stroke="#C7B6F1"/><text class="small" x="1131" y="584">Requires configured tariff + sun below;</text><text class="small" x="1131" y="606">uses the off-peak total operating limit.</text>
  </g>
  <path class="arrow" d="M937 380V430H310V476"/><path class="arrow" d="M937 380V476"/><path class="arrow" d="M937 430H1290V476"/>

  <g filter="url(#shadow)">
    <rect x="360" y="680" width="880" height="92" rx="22" fill="url(#controller)" stroke="#90B9F4"/><circle cx="410" cy="726" r="27" fill="#2F72FF"/><path d="M398 730h24M410 718v24M397 714l6 6M423 714l-6 6" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text class="head" x="452" y="714">DYNAMIC CURRENT BALANCING</text><text class="body" x="452" y="741">Converts power margin into amps · 6 A minimum · sends changes ≥ 0.5 A only</text><rect x="1030" y="704" width="174" height="44" rx="22" fill="#2F72FF"/><text x="1117" y="726" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#fff">WALLBOX A TARGET</text>
  </g>
  <path class="arrow-green" d="M310 628V654H610V680"/><path class="arrow-green" d="M800 628V680"/><path class="arrow-green" d="M1290 628V654H990V680"/>

  <g filter="url(#shadow)">
    <rect x="420" y="812" width="220" height="62" rx="16" fill="#fff" stroke="#C7D1E0"/><text class="head" x="530" y="838" text-anchor="middle">MQTT / HA buttons</text><text class="small" x="530" y="858" text-anchor="middle">mode · amps · authorization</text>
    <rect x="690" y="812" width="220" height="62" rx="16" fill="#17213A"/><text x="800" y="839" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">WALLBOX</text><text x="800" y="859" text-anchor="middle" font-size="12" font-weight="500" fill="#C8D5EE">delivers and measures</text>
    <rect x="960" y="812" width="220" height="62" rx="16" fill="#EAF8F1" stroke="#78CDA8"/><text class="head" x="1070" y="838" text-anchor="middle">EV CHARGING</text><text class="small" x="1070" y="858" text-anchor="middle">until the active target</text>
  </g>
  <path class="arrow" d="M800 772V792H530V812"/><path class="arrow-green" d="M640 843H690"/><path class="arrow-green" d="M910 843H960"/>

  <rect x="50" y="914" width="1500" height="66" rx="18" fill="#17213A"/><line x1="530" y1="928" x2="530" y2="966" stroke="#52627A"/><line x1="1045" y1="928" x2="1045" y2="966" stroke="#52627A"/>
  <text x="78" y="939" font-size="12" font-weight="700" fill="#7FB0FF">FORCE / OFF-PEAK</text><text x="78" y="960" font-size="13" font-weight="500" fill="#fff">A = (total limit − household loads) ÷ voltage</text>
  <text x="558" y="939" font-size="12" font-weight="700" fill="#72D6AC">PHOTOVOLTAIC</text><text x="558" y="960" font-size="13" font-weight="500" fill="#fff">A target = current A + (−grid + offset) ÷ voltage</text>
  <text x="1073" y="939" font-size="12" font-weight="700" fill="#D3C2FF">USEFUL INFORMATION</text><text x="1073" y="960" font-size="13" font-weight="500" fill="#fff">mode · target · actual current · estimated time and end</text>
</svg>
